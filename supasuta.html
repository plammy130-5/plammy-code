<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陳雅瑞 | 個人主頁</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            300: '#f9a8d4',
                            500: '#ec4899',
                            600: '#db2777',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 增加一些平滑過渡的動畫效果 */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 漸層動態背景 */
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #fff0f5, #ffe4e1, #fce7f3, #fdf2f8);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-gradient-animate min-h-screen flex items-center justify-center p-4 sm:p-8 text-gray-800 antialiased font-sans">

    <!-- 主卡片容器 -->
    <main class="w-full max-w-2xl bg-white/80 backdrop-blur-xl shadow-2xl rounded-3xl overflow-hidden relative fade-in-up">
        
        <!-- 頂部裝飾色塊 -->
        <div class="h-32 sm:h-40 bg-gradient-to-r from-brand-300 via-pink-200 to-rose-200"></div>

        <div class="px-6 sm:px-12 pb-12 text-center relative -mt-16 sm:-mt-20">
            
            <!-- 照片預留區 -->
            <!-- 使用者可將 src 替換為真實照片網址 -->
            <div class="inline-block relative">
                <img src="https://placehold.co/400x400/ffb6c1/ffffff?text=Photo" alt="陳雅瑞的照片" class="w-32 h-32 sm:w-40 sm:h-40 object-cover rounded-full border-4 border-white shadow-lg ring-4 ring-brand-100 transition-transform duration-300 hover:scale-105 mx-auto">
            </div>

            <!-- 基本資訊 -->
            <div class="mt-5 fade-in-up delay-100">
                <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 tracking-wide">陳雅瑞</h1>
                <p class="text-brand-600 font-medium mt-2 text-sm sm:text-base flex items-center justify-center gap-2">
                    <i class="fa-solid fa-graduation-cap"></i> 黎明技術學院 數位多媒體系
                </p>
                <div class="mt-4 mb-6">
                    <p class="text-gray-600 italic text-lg sm:text-xl font-light leading-relaxed">
                        「喜歡拍照和化妝，是個充滿自信的人。」
                    </p>
                </div>
            </div>

            <!-- 分隔線 -->
            <div class="h-px w-16 bg-brand-300 mx-auto my-6 rounded-full fade-in-up delay-200"></div>

            <!-- 專長與興趣 -->
            <div class="fade-in-up delay-200">
                <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-4">專長與興趣</h2>
                <div class="flex flex-wrap justify-center gap-2 sm:gap-3">
                    <span class="px-4 py-2 bg-brand-50 text-brand-600 rounded-full text-sm font-medium border border-brand-100 shadow-sm transition hover:bg-brand-100 hover:-translate-y-1">
                        <i class="fa-solid fa-person-walking mr-1"></i> 舞蹈
                    </span>
                    <span class="px-4 py-2 bg-brand-50 text-brand-600 rounded-full text-sm font-medium border border-brand-100 shadow-sm transition hover:bg-brand-100 hover:-translate-y-1">
                        <i class="fa-solid fa-film mr-1"></i> 影片設計與剪輯
                    </span>
                    <span class="px-4 py-2 bg-brand-50 text-brand-600 rounded-full text-sm font-medium border border-brand-100 shadow-sm transition hover:bg-brand-100 hover:-translate-y-1">
                        <i class="fa-solid fa-plane mr-1"></i> 旅行
                    </span>
                    <span class="px-4 py-2 bg-brand-50 text-brand-600 rounded-full text-sm font-medium border border-brand-100 shadow-sm transition hover:bg-brand-100 hover:-translate-y-1">
                        <i class="fa-solid fa-cookie-bite mr-1"></i> 吃零食
                    </span>
                    <span class="px-4 py-2 bg-brand-50 text-brand-600 rounded-full text-sm font-medium border border-brand-100 shadow-sm transition hover:bg-brand-100 hover:-translate-y-1">
                        <i class="fa-solid fa-shoe-prints mr-1"></i> 步行
                    </span>
                </div>
            </div>

            <!-- 聯絡方式 -->
            <div class="mt-10 fade-in-up delay-300">
                <div class="bg-gray-50 rounded-2xl p-6 shadow-inner border border-gray-100">
                    <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-4">聯絡我</h2>
                    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 sm:gap-8">
                        <!-- Email -->
                        <a href="mailto:bd1151023@venus.lit.edu.tw" class="group flex items-center gap-3 text-gray-600 hover:text-brand-600 transition-colors">
                            <div class="w-10 h-10 rounded-full bg-white shadow-md flex items-center justify-center group-hover:bg-brand-50 group-hover:scale-110 transition-all">
                                <i class="fa-solid fa-envelope text-lg"></i>
                            </div>
                            <span class="text-sm font-medium hidden sm:block">Email</span>
                        </a>
                        
                        <!-- Line -->
                        <div class="group flex items-center gap-3 text-gray-600 hover:text-[#00B900] transition-colors cursor-pointer" onclick="copyToClipboard('supasuta.plammy')">
                            <div class="w-10 h-10 rounded-full bg-white shadow-md flex items-center justify-center group-hover:bg-green-50 group-hover:scale-110 transition-all">
                                <i class="fa-brands fa-line text-xl"></i>
                            </div>
                            <div class="text-left hidden sm:block">
                                <span class="text-xs text-gray-400 block -mb-1">LINE ID</span>
                                <span class="text-sm font-medium group-hover:text-[#00B900]">supasuta.plammy</span>
                            </div>
                        </div>

                        <!-- Instagram -->
                        <a href="https://instagram.com/Splammy_" target="_blank" rel="noopener noreferrer" class="group flex items-center gap-3 text-gray-600 hover:text-brand-500 transition-colors">
                            <div class="w-10 h-10 rounded-full bg-white shadow-md flex items-center justify-center group-hover:bg-brand-50 group-hover:scale-110 transition-all">
                                <i class="fa-brands fa-instagram text-xl"></i>
                            </div>
                            <div class="text-left hidden sm:block">
                                <span class="text-xs text-gray-400 block -mb-1">Instagram</span>
                                <span class="text-sm font-medium group-hover:text-brand-500">Splammy_</span>
                            </div>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 複製成功的提示訊息 -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm opacity-0 transition-opacity duration-300 pointer-events-none">
        LINE ID 已複製！
    </div>

    <script>
        // 點擊複製 Line ID 的功能
        function copyToClipboard(text) {
            // 使用傳統方式以提高 iframe 兼容性
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('複製失敗', err);
            }
            document.body.removeChild(textArea);
        }

        // 顯示提示訊息
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
